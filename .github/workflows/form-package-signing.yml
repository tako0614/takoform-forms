name: Prepare signed Edge Form Package set
run-name: Sign ${{ inputs.expected_commit }}

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact protected-main source commit to sign
        required: true
        type: string
      previous_set:
        description: Exact public predecessor set source commit; leave blank only for the first genesis set
        required: false
        type: string
      statement_version:
        description: New revocation statement SemVer; required with previous_set
        required: false
        type: string
      transition_mode:
        description: Explicit continuation, genesis, or advancement; blank preserves the existing genesis/advancement input pair
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: edge-form-package-signing-${{ inputs.expected_commit }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  EXPECTED_COSIGN_VERSION: "v3.0.6"

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: form-package-signing
    steps:
      - name: Check out the exact protected-main source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pinned: v6.0.2
        with:
          ref: ${{ inputs.expected_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the workflow and source identities
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          PREVIOUS_SET: ${{ inputs.previous_set }}
          STATEMENT_VERSION: ${{ inputs.statement_version }}
          REQUESTED_MODE: ${{ inputs.transition_mode }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected_commit must be an exact lowercase 40-character Git commit" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "signing requires refs/heads/main" >&2
            exit 1
          fi
          if [[ "$GITHUB_WORKFLOW_REF" != "$GITHUB_REPOSITORY/.github/workflows/form-package-signing.yml@refs/heads/main" ]]; then
            echo "signing requires the protected main workflow identity" >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$EXPECTED_COMMIT" || "$GITHUB_SHA" != "$EXPECTED_COMMIT" ]]; then
            echo "checked-out source does not equal expected_commit" >&2
            exit 1
          fi
          if [[ "$(git rev-parse refs/remotes/origin/main)" != "$EXPECTED_COMMIT" ]]; then
            echo "expected_commit must be current origin/main" >&2
            exit 1
          fi
          mode="$REQUESTED_MODE"
          if [[ -z "$mode" ]]; then
            if [[ -z "$PREVIOUS_SET" && -z "$STATEMENT_VERSION" ]]; then
              mode=genesis
            elif [[ -n "$PREVIOUS_SET" && -n "$STATEMENT_VERSION" ]]; then
              mode=advancement
            else
              echo "previous_set and statement_version must be supplied together unless transition_mode is continuation" >&2
              exit 1
            fi
          fi
          case "$mode" in
            genesis)
              if [[ -n "$PREVIOUS_SET" || -n "$STATEMENT_VERSION" ]]; then
                echo "genesis accepts neither predecessor nor statement" >&2
                exit 1
              fi
              ;;
            continuation)
              if [[ -z "$PREVIOUS_SET" || -n "$STATEMENT_VERSION" ]]; then
                echo "continuation requires previous_set and forbids statement_version" >&2
                exit 1
              fi
              ;;
            advancement)
              if [[ -z "$PREVIOUS_SET" || -z "$STATEMENT_VERSION" ]]; then
                echo "advancement requires previous_set and statement_version" >&2
                exit 1
              fi
              ;;
            *)
              echo "transition_mode must be genesis, continuation, or advancement" >&2
              exit 1
              ;;
          esac
          if [[ "$mode" != genesis ]]; then
            if [[ ! "$PREVIOUS_SET" =~ ^[0-9a-f]{40}$ || "$PREVIOUS_SET" =~ ^0{40}$ ]]; then
              echo "previous_set must be an exact lowercase nonzero 40-character source commit" >&2
              exit 1
            fi
          fi
          if [[ "$mode" == advancement ]]; then
            if [[ ! "$STATEMENT_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ || "$STATEMENT_VERSION" == "0.0.0" ]]; then
              echo "statement_version must be a non-genesis SemVer" >&2
              exit 1
            fi
          fi
          echo "TRANSITION_MODE=$mode" >> "$GITHUB_ENV"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # pinned: v2.0.2
        with:
          bun-version: 1.3.14

      - name: Setup Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # pinned: v6.0.0
        with:
          go-version: "1.25.8"
          cache: true
          cache-dependency-path: go.sum

      - name: Install pinned workspace tools
        run: bun install --frozen-lockfile

      - name: Verify the exact source before signing
        run: bun run check

      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # pinned: v4.1.2, Cosign v3.0.6
        with:
          cosign-release: "v3.0.6"

      - name: Prepare and keyless-sign every exact Core subject
        id: sign
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          PREVIOUS_SET: ${{ inputs.previous_set }}
          STATEMENT_VERSION: ${{ inputs.statement_version }}
        run: |
          set -euo pipefail
          cosign_version="$(cosign version 2>&1)"
          grep -F "$EXPECTED_COSIGN_VERSION" <<<"$cosign_version"

          candidate="$RUNNER_TEMP/edge-form-package-signing/$EXPECTED_COMMIT"
          preparation="$RUNNER_TEMP/edge-form-package-signing-preparation.json"
          roster="$RUNNER_TEMP/edge-form-package-signing-roster.json"
          bun scripts/form-publication.mjs --signing-roster > "$roster"
          jq -e '.packageCount > 0 and (.activeReleasePaths | length) == .packageCount and (.activeReleasePaths | unique | length) == .packageCount' "$roster" >/dev/null
          if [[ "$TRANSITION_MODE" == genesis ]]; then
            public_refs="$(GIT_TERMINAL_PROMPT=0 git -c credential.helper= -c http.extraHeader= ls-remote --tags https://github.com/tako0614/takoform-forms.git 'refs/tags/forms/sets/*' 'refs/tags/forms/revocations/v*')"
            if [[ -n "$public_refs" ]]; then
              echo "genesis signing is first-set-only; public publisher/revocation refs already exist" >&2
              exit 1
            fi
            go run ./cmd/publisher-trust prepare \
              --repository . \
              --output "$candidate" > "$preparation"
            jq -e \
              --arg output "$candidate" \
              --slurpfile roster "$roster" \
              '.status == "signing-required" and .coreVersion == "v1.1.0" and .mode == "genesis" and .sequence == 0 and .checkpointVersion == "0.0.0" and .packageCount == $roster[0].packageCount and .output == $output and (.subjects | length) == (.packageCount + 1) and ([.subjects[].path] | index("revocations/checkpoint.json")) != null and ([.subjects[].path] | index("publisher-set/lineage.json")) == null' \
              "$preparation" >/dev/null
          elif [[ "$TRANSITION_MODE" == continuation ]]; then
            mapfile -t active_paths < <(jq -r '.activeReleasePaths[]' "$roster")
            command=(go run ./cmd/publisher-trust prepare-continuation --repository . --previous-set "$PREVIOUS_SET")
            for release_path in "${active_paths[@]}"; do
              command+=(--active-release-path "$release_path")
            done
            command+=(--output "$candidate")
            "${command[@]}" > "$preparation"
            jq -e \
              --arg output "$candidate" \
              --arg previous "$PREVIOUS_SET" \
              --slurpfile roster "$roster" \
              '.status == "signing-required" and .coreVersion == "v1.1.0" and .mode == "continuation" and .previousSetId == $previous and (.revocationTag // "") == "" and .packageCount == $roster[0].packageCount and .output == $output and (.subjects | length) == (.packageCount + 1) and ([.subjects[].path] | index("publisher-set/lineage.json")) != null and ([.subjects[].path] | index("revocations/checkpoint.json")) == null' \
              "$preparation" >/dev/null
          else
            go run ./cmd/publisher-trust prepare-advancement \
              --repository . \
              --previous-set "$PREVIOUS_SET" \
              --statement-version "$STATEMENT_VERSION" \
              --output "$candidate" > "$preparation"
            jq -e \
              --arg output "$candidate" \
              --arg previous "$PREVIOUS_SET" \
              --arg version "$STATEMENT_VERSION" \
              --slurpfile roster "$roster" \
              '.status == "signing-required" and .coreVersion == "v1.1.0" and .mode == "advancement" and .sequence >= 1 and .checkpointVersion == $version and .previousSetId == $previous and .revocationTag == ("forms/revocations/v" + $version) and .packageCount == $roster[0].packageCount and .output == $output and ((.subjects | length) == (.packageCount + 1) or (.subjects | length) == (.packageCount + 2)) and ([.subjects[].path] | index("revocations/checkpoint.json")) != null' \
              "$preparation" >/dev/null
          fi

          jq -e '([.subjects[].path] | unique | length) == (.subjects | length) and ([.subjects[] | select(.path | test("^packages/[^/]+/[^/]+/package-index.json$"))] | length) == .packageCount and all(.subjects[]; .path == "revocations/checkpoint.json" or .path == "publisher-set/lineage.json" or (.path | test("^packages/[^/]+/[^/]+/package-index.json$")))' "$preparation" >/dev/null

          while IFS= read -r subject; do
            case "$subject" in
              revocations/checkpoint.json)
                bundle="revocations/checkpoint.sigstore.json"
                ;;
              publisher-set/lineage.json)
                bundle="publisher-set/lineage.sigstore.json"
                ;;
              packages/*/package-index.json)
                bundle="${subject%package-index.json}package-index.sigstore.json"
                ;;
              *)
                echo "unexpected signing subject $subject" >&2
                exit 1
                ;;
            esac
            test ! -e "$candidate/$bundle"
            cosign sign-blob "$candidate/$subject" \
              --bundle "$candidate/$bundle" \
              --yes
          done < <(jq -r '.subjects[].path' "$preparation")

          verification="$RUNNER_TEMP/edge-form-package-signing-verification.json"
          go run ./cmd/publisher-trust verify-evidence \
            --repository . \
            --evidence "$candidate" \
            --expected-source-commit "$EXPECTED_COMMIT" > "$verification"
          jq -e \
            --arg commit "$EXPECTED_COMMIT" \
            --slurpfile roster "$roster" \
            '.status == "verified" and .coreVersion == "v1.1.0" and .setId == $commit and .sourceCommit == $commit and .packageCount == $roster[0].packageCount and (.packages | length) == .packageCount and ([.packages[].locator.sourcePath] | sort) == ($roster[0].activeReleasePaths | sort) and .checkpoint.status == "verified" and (.checkpointHistory | length) == (.checkpoint.pin.sequence + 1)' \
            "$verification" >/dev/null
          if [[ "$TRANSITION_MODE" == genesis ]]; then
            jq -e '.checkpoint.pin.sequence == 0 and (.revocationTags | length) == 0 and (.statements | length) == 0' "$verification" >/dev/null
          elif [[ "$TRANSITION_MODE" == continuation ]]; then
            jq -e \
              --arg previous "$PREVIOUS_SET" \
              --arg commit "$EXPECTED_COMMIT" \
              '.mode == "continuation" and .previousSetId == $previous and (.revocationTag // "") == "" and .setHistory[-1].setId == $commit and .setHistory[-2].setId == $previous and .setHistory[-1].pin == .setHistory[-2].pin and .checkpoint.pin == .checkpointHistory[-1].pin' \
              "$verification" >/dev/null
          else
            jq -e \
              --arg previous "$PREVIOUS_SET" \
              --arg version "$STATEMENT_VERSION" \
              '.checkpoint.pin.sequence >= 1 and ((.previousSetId // .previousCheckpoint.setId) == $previous) and .revocationTag == ("forms/revocations/v" + $version) and .statements[-1].statementVersion == $version' \
              "$verification" >/dev/null
          fi
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"

      - name: Upload the closed candidate for create-only operator import
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # pinned: v7.0.1
        with:
          name: edge-form-package-signing-${{ inputs.expected_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.sign.outputs.candidate }}
          if-no-files-found: error
          retention-days: 1
